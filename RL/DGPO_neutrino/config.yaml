  entity: "ytchou97-university-of-washington"
  name: "nu2flow-RL-NeurIPS"
  run_name: "nu2flow-RL-NeurIPS-reproduce"
  tags: [ "NERSC", "RL", "Neutrinos", "QE", "PIDM" ]
