# TT2L EveNet training layout (defaults pulled from configs/tt2l/) plus DGPO-neutrino RL add-on at the bottom.
# default: paths are relative to this file's directory (RL/DGPO_neutrino/).

platform:
  # Materialized subset (see RL/DGPO_neutrino/data_preprocess/make_dataset_subset.py).
  # Replace these placeholders with local TT2L Parquet directories.
  data_parquet_dir: "/pscratch/sd/y/yiren/RL/nu2flow_dataset/DGPO/mg5_train_subset_20pct/train"
  data_parquet_val_dir: "/pscratch/sd/y/yiren/RL/nu2flow_dataset/DGPO/mg5_train_subset_20pct/val"
  # 4 nodes × 4 GPUs per node = 16 workers for distributed training
  number_of_workers: 16
  resources_per_worker: { "CPU": 15, "GPU": 1 }
  batch_size: 256
  prefetch_batches: 2
  use_gpu: true

  #=== LOCAL TESTING (uncomment for local) ===
  #data_parquet_dir: "data/tt2l_dgpo/debug/train"
  #number_of_workers: 1
  #resources_per_worker: { "CPU": 4, "GPU": 0 }
  #batch_size: 16
  #prefetch_batches: 1
  #use_gpu: false


options:
  default: ../../configs/tt2l/options.yaml

  Training:
    total_epochs: 150
    epochs: 150
    # Replace with local output and checkpoint paths before running.
    model_checkpoint_save_path: "/pscratch/sd/y/yiren/RL/NeurIPS_reproduce/checkpoints/"
    model_checkpoint_save_top_k: 500  # keep best 10 by val/reward/mean (EveNet uses 50)
    # Resume DGPO training from the latest checkpoint in this run directory.
    model_checkpoint_load_path: "/global/cfs/cdirs/m5019/yiren/NeurIPS/Paper/model_weights/base_pretrain.ckpt"
    # First DGPO run from supervised E2E weights:
    #model_checkpoint_load_path: "checkpoints/supervised_reference.ckpt"

    # === LOCAL TESTING (uncomment for local) ===
    # model_checkpoint_save_path: "outputs/debug/checkpoints"
    # pretrain_model_load_path: "checkpoints/debug_reference.ckpt"

    diffusion_every_n_epochs: 25 # how often to run diffusion
    diffusion_every_n_steps: 1 # how often to run diffusion inside the valid epoch

    learning_rate: &lr 0.00001
#    learning_rate_obj: &lr_obj 0.000032
    learning_rate_body: &lr_body 0.000001
#    learning_rate_body: &lr_body 0.000025
    weight_decay: &wd 0.01
    Components:
      GlobalEmbedding:
        learning_rate: *lr_body
        weight_decay: *wd
        optimizer_type: "AdamW"
        warm_up: true
        freeze:
          type: none
      PET:
        learning_rate: *lr_body
        weight_decay: *wd
        optimizer_type: "AdamW"
        warm_up: true
        freeze:
          type: none
      ObjectEncoder:
        learning_rate: *lr_body
        weight_decay: *wd
        optimizer_type: "AdamW"
        warm_up: true
        freeze:
          type: none
      Classification:
        include: false
        include_cross_term: false
      Regression:
        include: false
      Assignment:
        include: true
        warm_up: true
        learning_rate: *lr
        weight_decay: *wd
        optimizer_type: "AdamW"
        freeze:
          type: none
      GlobalGeneration:
        include: false
      ReconGeneration:
        include: false
      TruthGeneration:
        include: true
        warm_up: true
        learning_rate: *lr
        weight_decay: *wd
        optimizer_type: "AdamW"
        physics_informed: false
        diffusion_steps: 100
        cartesian: false
        freeze:
          type: none
        pidm:
          snr_clamp: 5.0        # γ for λ_t = min(SNR, γ) - data loss weight (Min-SNR-5)
          physics_c: 10000     # c for Σ̄_t = Σ_t/c - physics variance scaling (smaller = stronger physics)
          use_pidm_weighting: true  # whether to apply dynamic weighting
          normalize_by_width: false  # normalize residuals by particle width (recommended)

    EarlyStopping:
      patience: 25
      min_delta: 0.0
      monitor: "val/loss"
      mode: "min"
      verbose: true

    EMA:
      enable: true               # Enable or disable EMA
      decay: 0.999               # EMA decay rate
      start_epoch: 0             # Start updating EMA after this epoch
      update_every_n_steps: 1   # Update EMA every N steps

      replace_model_after_load: true    # After loading checkpoint, copy EMA weights into model
      replace_model_at_end: false         # At training end, copy EMA weights into model (will not save EMA weights)

  Dataset:
    dataset_limit: 1.0   # fraction of parquet rows to use (1.0 = full); use 1.0 with materialized subset dirs
    normalization_file: "/pscratch/sd/y/yiren/RL/nu2flow_dataset/DGPO/mg5_train_subset_20pct/train/normalization.pt"
    # === LOCAL TESTING (uncomment for local) ===
    # normalization_file: "data/tt2l_dgpo/debug/train/normalization.pt"
    # dataset_limit: 0.1   # Use 10% of data for local testing
    val_split: [ 0.7, 1.0 ]


network:
#  default: configs/model.yaml
  #  default: configs/model_large.yaml
  default: ../../configs/tt2l/pretrain.yaml

  # Disable all dropout for DGPO: current policy and reference model must
  # produce deterministic outputs for precise log-likelihood comparison.
  Body:
    GlobalEmbedding:
      dropout: 0.0
    PET:
      feature_drop: 0.0
      dropout: 0.0
      drop_probability: 0.0
    ObjectEncoder:
      dropout: 0.0
  Assignment:
    feature_drop: 0.0
    dropout: 0.0
  ReconGeneration:
    feature_drop: 0.0
    dropout: 0.0
    drop_probability: 0.0
  TruthGeneration:
    feature_drop: 0.0
    dropout: 0.0
    drop_probability: 0.0

event_info:
  default: ../../configs/tt2l/event_info.yaml

  # overwrites
  # ...

resonance:
  default: ../../configs/tt2l/resonance.yaml

  # overwrites
  # ...
