  save_dir: "/pscratch/sd/y/yiren/RL/nu2flow_DGPO_model/logs"
  #save_dir: "/Users/yirenwu/Machine Learning Research Reasoning Model/Dataset/logs"
  # === LOCAL TESTING (uncomment for local) ===
  # save_dir: "/Users/yirenwu/Machine Learning Research Reasoning Model/Dataset/logs"
  name: "nu2flow_RL"

# ---------------------------------------------------------------------------
# DGPO neutrino RL add-on.
# ---------------------------------------------------------------------------

dgpo:
  beta: 5               # beta_dgpo: scales per-event gate M_e
  beta_kl: 0.05                # velocity-space anchor: loss_total += resolved_KL_weight * mean(||v_theta - v_ref||^2)
  # Main DGPO advantage normalization over K candidates.
  advantage_transform:
    mode: zscore
    temperature: 1.0
  K: 10               # candidates per event (training rollout + DGPO only)
  validation_K: 1               # val: DDIM candidates per event (default 1: one current + optional one ref for winrate)
  num_ddim_steps: 20           # T_sample: DDIM steps for online generation
  shared_noise: true            # same eps, t across K during policy evaluation
  # Replay frozen rollout data for multiple optimizer steps (reference DGPO-style inner loop).
  num_inner_epochs: 1           # passes over the same candidates/rewards/advantages per batch
  num_train_timesteps: 8        # fresh (t, eps) per sub-step; with accumulate_train_timesteps=true: M timesteps, one update
  # true: backprop (loss/M) for each training timestep, then one clipped AdamW step per batch (reference DGPO-style).
  # false: one AdamW step per (inner_epoch × timestep) sub-step (legacy; stronger updates on stale rollouts).
  accumulate_train_timesteps: true
  # Advantage clamp before loss (null = no clamp).
  adv_clip_max: 5.0
  grad_clip_norm: 1.0           # global grad norm clip (AdamW step)
  policy_eval_t_min: 0.0        # lower bound for diffusion timestep t sampled in policy_evaluation_step
  policy_eval_t_max: 0.7        # upper bound: avoid near-pure-noise regime where gradient signal is weak
  use_ema_for_rollout: true     # swap rollout EMA shadow into model for Phase-1 generation, then restore trainable weights
  update_ema_rollout: true      # keep rollout EMA updated during training
  # Rollout EMA decay per step: decay = min(ema_rollout_decay_max, ema_rollout_decay_ramp * global_step) (Flow GRPO ema_ref style).
  ema_rollout_decay_max: 0.3
  ema_rollout_decay_ramp: 0.001
  log_every: 1                  # console INFO every N optimizer steps
  log_reward_dist_every: 5       # wandb reward/dist/overlap (3 overlaid 1D hists as wandb.Image) every N steps
  diagnostic_profile_accumulate_steps: 10  # concatenate N train batches for stable truth-bin diagnostic profiles
  # If true, each val batch runs one extra ref-policy DDIM for val/winrate (default off: cheaper val).
  validation_compute_winrate: true
  # Validation visibility (long Ray + DDIM runs are otherwise silent).
  validation_log_batches: true       # INFO per val batch: start + DDIM wall time
  validation_tqdm_k_chains: true    # tqdm bar over the K sequential DDIM chains per batch
  # Optional differentiable residual anchor over a dense truth-pT interval.
  offset_anchor:
    enabled: true             # pT-only mean-shift correction
    mode: pt_eta_phi_mean              # pt_mean | xyz_mean | pt_eta_phi_mean
    lambda: 0.05
    pt_min: 0.0
    pt_max: 300.0
    scale: 10.0                # explicit GeV scale
    mu_ref: 0.0
    scale_pt_eta_phi: [5.0, auto, auto]
    mu_ref_pt_eta_phi: [0.0, 0.0, 0.0]
    loss_type: mse           # huber | mse
    min_count: 200             # min masked entries pooled into μ_theta for the anchor backward term.
    # all_candidates is required for the unbiasedness goal: residual must be
    # zero across the full candidate distribution, not only the reward argmax.
    apply_to: all_candidates   # all_candidates | best_candidate (reward argmax per event); weighted_candidates reserved.

reward_config:
  # Main reward: component-normalized truth-distance in Cartesian neutrino momentum.
  rule_based:
    enabled: true
    weight: 1.0
    mode: "component_normalized_truth_distance"
    # Scales are always loaded from normalization.pt's
    # ``invisible_cartesian_std['Source']`` (shape (3,) ordered [px, py, pz],
    # sample-wise std computed at preprocessing). The same px/py/pz std is
    # applied to both neutrinos (nu1_px = nu2_px = std[0], etc.).
    component_normalized:
      eps: 1.0e-8
